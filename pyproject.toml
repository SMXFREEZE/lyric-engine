[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-engine"
version = "0.1.0"
description = "Phonetic-aware lyrics generation: CMU phoneme annotation, rhyme/flow/valence scoring, a 9-module metacognitive reranker, and a FastAPI co-write server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sami El-Figha" }]
keywords = ["lyrics", "nlp", "phonetics", "music", "llm", "generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.43.0",
    "peft>=0.11.0",
    "pronouncing>=0.2.0",
    "nltk>=3.8.1",
    "textblob>=0.18.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "lyricsgenius>=3.0.1",
    "billboard.py>=2.5.0",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
audio = [
    "audiocraft>=1.3.0",
    "suno-bark>=0.0.1a0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
]
train = [
    "trl>=0.9.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.19.0",
]

[project.urls]
Repository = "https://github.com/SMXFREEZE/lyric-engine"

[tool.setuptools.packages.find]
include = ["src*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
